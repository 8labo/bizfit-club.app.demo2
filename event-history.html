<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFit イベント管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;--bg:#f4f6f8;--orange:#F39800;--ink:#172033;--muted:#748095;--line:#edf0f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{background:var(--orange);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}header a{font-size:11px;color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:22px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:800;color:#667085}.tabs button.on{background:var(--orange);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.item{padding:13px 0;border-top:1px solid #edf1f4}.item:first-child{border-top:0}.item b{font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:5px}.badge{display:inline-flex;margin-left:6px;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900;background:#eef2f6}.cancel{background:#fff0f0;color:#b34646}.empty{font-size:12px;color:#9aa4b2;padding:18px 0}</style></head><body><header><b>BizFit CLUB｜イベント管理</b><a href="admin-access.html">← BizFit管理に戻る</a></header><main class="wrap"><div class="tabs"><button class="on" data-mode="upcoming">今後の予定</button><button data-mode="history">イベント履歴</button><button data-mode="cancelled">中止</button></div><div class="card"><div class="toolbar"><select id="category"><option value="">すべてのカテゴリ</option><option value="stretch">ストレッチ</option><option value="training">トレーニング</option><option value="community">軽スポーツ・交流</option><option value="assessment">測定</option><option value="general">その他</option></select><input id="search" placeholder="イベント名・会場を検索"><input id="from" type="date"><input id="to" type="date"></div><div id="list">読み込み中…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax'),$=id=>document.getElementById(id);let rows=[],mode='upcoming';const today=()=>new Date().toISOString().slice(0,10);async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return $('list').textContent='ログインが必要です。';const{data:s}=await sb.from('services').select('id').eq('service_code','BIZFIT').single();const{data:ok}=await sb.rpc('has_service_access',{target_service_id:s.id});if(!ok)return $('list').textContent='管理権限がありません。';const{data,error}=await sb.from('bizfit_events').select('*').order('event_date',{ascending:false}).limit(1000);if(error)return $('list').textContent=error.message;rows=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,from=$('from').value,to=$('to').value,t=today();let a=rows.filter(x=>mode==='cancelled'?x.status==='cancelled':mode==='history'?x.event_date<t&&x.status!=='cancelled':x.event_date>=t&&x.status!=='cancelled');a=a.filter(x=>(!cat||x.category===cat)&&(!from||x.event_date>=from)&&(!to||x.event_date<=to)&&(!q||`${x.title} ${x.venue||''}`.toLowerCase().includes(q)));a.sort((a,b)=>mode==='history'?b.event_date.localeCompare(a.event_date):a.event_date.localeCompare(b.event_date));$('list').innerHTML=a.map(x=>`<div class="item"><b>${x.event_date}｜${x.title}</b>${x.status==='cancelled'?'<span class="badge cancel">中止</span>':''}<div class="meta">${(x.start_time||'').slice(0,5)}${x.end_time?'〜'+x.end_time.slice(0,5):''}${x.venue?'｜'+x.venue:''}</div></div>`).join('')||'<div class="empty">該当するイベントはありません。</div>'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));render()});['search','category','from','to'].forEach(id=>$(id).oninput=render);boot();</script></body></html>
