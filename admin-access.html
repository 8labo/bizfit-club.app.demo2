<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFit 管理</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f8;color:#172033;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #edf0f3;border-radius:20px;padding:24px;text-align:center}.box b{font-size:18px}.box p{font-size:12px;color:#748095;line-height:1.7}.back{display:inline-block;margin-top:10px;color:#d47d00;font-size:11px;text-decoration:none}</style></head><body><div class="box"><b>BizFitクラブ 管理</b><p id="msg">管理権限を確認しています…</p><a class="back" href="https://8labo.github.io/8labo.app.demo/staff.html">管理一覧に戻る</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax');async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){msg.textContent='共通ポータルでログインしてください。';return}const {data:s}=await sb.from('services').select('id').eq('service_code','BIZFIT').single();if(!s){msg.textContent='BizFitサービス情報を取得できません。';return}const {data:ok}=await sb.rpc('has_service_access',{target_service_id:s.id});if(!ok){msg.textContent='BizFitクラブの管理権限がありません。';return}location.replace('./admin.html')}boot();</script></body></html>
