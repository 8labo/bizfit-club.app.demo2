<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFit CLUB</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style></head><body><iframe id="memberFrame" src="member-v2.html" title="BizFit CLUB"></iframe><script>document.getElementById('memberFrame').addEventListener('load',()=>{const d=document.getElementById('memberFrame').contentDocument;if(!d)return;const s=d.createElement('script');s.textContent=`(()=>{const modal=document.getElementById('noticeModal');if(modal&&!document.getElementById('closeNoticeModal')){const b=document.createElement('button');b.id='closeNoticeModal';b.textContent='閉じる';b.className='mb-4 text-xs font-bold text-slate-500';const card=modal.querySelector('.modal-card');if(card)card.insertBefore(b,card.firstChild);b.onclick=()=>modal.classList.add('hidden');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden')})}window.loadPersonal=async()=>{let {data:m}=await sb.from('bizfit_personal_messages').select('*').eq('person_id',personId).eq('is_active',true).order('created_at',{ascending:false}),{data:r}=await sb.from('bizfit_personal_message_reads').select('*').eq('person_id',personId);let read=new Set((r||[]).map(x=>x.message_id)),t=today();let visible=(m||[]).filter(x=>{if(x.display_mode==='period'&&((x.start_date&&x.start_date>t)||(x.end_date&&x.end_date<t)))return false;if(x.display_mode==='until_confirmed'&&read.has(x.id))return false;return true});personalSection.classList.toggle('hidden',!visible.length);personalList.innerHTML=visible.map(x=>{const confirmed=read.has(x.id),need=x.display_mode==='until_confirmed'||x.require_confirmation;return '<div class="personal '+(x.is_important?'important':'')+'"><div class="text-[12px] leading-6 text-slate-600">'+String(x.message).replace(/\n/g,'<br>')+'</div>'+(need&&!confirmed?'<button onclick="confirmPersonal(\''+x.id+'\')" class="mt-3 px-4 py-2 rounded-xl bg-accent text-white text-[11px] font-black">確認しました</button>':(confirmed?'<div class="mt-3 text-[10px] font-bold text-slate-400">確認済み</div>':''))+'</div>'}).join('')};window.confirmPersonal=async id=>{let {error}=await sb.from('bizfit_personal_message_reads').insert({message_id:id,person_id:personId,confirmed_at:new Date().toISOString()});if(error&&!String(error.message).toLowerCase().includes('duplicate'))return alert(error.message);await loadPersonal()};
const ap=document.getElementById('page-activity');if(ap){ap.className='page px-5 pt-5 pb-8 space-y-5';ap.innerHTML='<div><div class="section-label">MY ACTIVITY</div><h1 class="text-xl font-black mt-1">あなたの活動記録</h1><p class="text-xs text-slate-400 mt-2">続けてきたことを、少しずつ振り返れます。</p></div><div id="activitySummary" class="grid grid-cols-3 gap-2"></div><div class="card p-5"><div class="flex items-center justify-between"><button id="calPrev" class="w-9 h-9 rounded-xl bg-slate-100 grid place-items-center text-slate-500">‹</button><div id="calTitle" class="font-black text-sm"></div><button id="calNext" class="w-9 h-9 rounded-xl bg-slate-100 grid place-items-center text-slate-500">›</button></div><div class="grid grid-cols-7 text-center text-[9px] font-bold text-slate-400 mt-4"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div id="activityCalendar" class="grid grid-cols-7 gap-y-2 mt-2"></div><div class="flex items-center gap-2 mt-4 text-[10px] text-slate-400"><span class="w-2.5 h-2.5 rounded-full bg-accent"></span>参加した日</div></div><div id="milestoneCard" class="card p-5"></div><div class="card p-5"><div class="section-label">RECENT ACTIVITY</div><h2 class="text-base font-black mt-1">最近の活動</h2><div id="recentActivityMember" class="mt-3"></div></div><div class="card p-5"><div class="section-label">YOUR JOURNEY</div><h2 class="text-base font-black mt-1">これまでの軌跡</h2><div id="journeyList" class="mt-4"></div></div>'}
let activityRecords=[],calDate=new Date();const ym=x=>x.activity_date.slice(0,7),jpDate=s=>{const q=new Date(s+'T00:00:00');return (q.getMonth()+1)+'月'+q.getDate()+'日'},diffMonth=(a,b)=>(a.getFullYear()-b.getFullYear())*12+a.getMonth()-b.getMonth();function streakInfo(records){const months=[...new Set(records.map(ym))].sort();if(!months.length)return{current:0,best:0};let best=1,run=1;for(let i=1;i<months.length;i++){let a=new Date(months[i-1]+'-01T00:00:00'),b=new Date(months[i]+'-01T00:00:00');if(diffMonth(b,a)===1)run++;else run=1;best=Math.max(best,run)}let latest=new Date(months[months.length-1]+'-01T00:00:00'),now=new Date(),gap=diffMonth(new Date(now.getFullYear(),now.getMonth(),1),latest),current=gap<=1?run:0;return{current,best}}function nextMilestone(n){let a=[1,5,10,20,30,50,75,100];for(const x of a)if(n<x)return x;return Math.ceil((n+1)/50)*50}function renderSummary(){const now=new Date(),key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),monthCount=activityRecords.filter(r=>ym(r)===key).length,st=streakInfo(activityRecords),stText=st.current?st.current:'—',stLabel=st.current?'か月継続':'またここから';activitySummary.innerHTML='<div class="card p-3 text-center"><div class="text-xl font-black">'+monthCount+'<span class="text-[10px] ml-1 text-slate-400">回</span></div><div class="text-[9px] font-bold text-slate-400 mt-1">今月</div></div><div class="card p-3 text-center"><div class="text-xl font-black">'+activityRecords.length+'<span class="text-[10px] ml-1 text-slate-400">回</span></div><div class="text-[9px] font-bold text-slate-400 mt-1">累計</div></div><div class="card p-3 text-center"><div class="text-xl font-black">'+stText+(st.current?'<span class="text-[10px] ml-1 text-slate-400">か月</span>':'')+'</div><div class="text-[9px] font-bold text-slate-400 mt-1">'+stLabel+'</div></div>'}function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7,key=y+'-'+String(m+1).padStart(2,'0'),active=new Set(activityRecords.filter(r=>ym(r)===key).map(r=>Number(r.activity_date.slice(8,10))));calTitle.textContent=y+'年 '+(m+1)+'月';let h='';for(let i=0;i<offset;i++)h+='<span></span>';for(let day=1;day<=days;day++){let on=active.has(day);h+='<div class="h-8 grid place-items-center"><span class="w-7 h-7 rounded-full grid place-items-center text-[11px] font-bold '+(on?'bg-accent text-white':'text-slate-600')+'">'+day+'</span></div>'}activityCalendar.innerHTML=h}calPrev.onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};calNext.onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};function renderMilestone(){const n=activityRecords.length,next=nextMilestone(n),prev=n===0?0:[1,5,10,20,30,50,75,100].filter(x=>x<=n).pop()||0,p=Math.min(100,Math.round((n-prev)/(next-prev)*100));milestoneCard.innerHTML='<div class="section-label">NEXT MILESTONE</div><div class="flex justify-between items-end mt-1"><div><h2 class="text-base font-black">'+(n?'あと'+(next-n)+'回で'+next+'回参加！':'最初の1回からスタート')+'</h2><p class="text-[10px] text-slate-400 mt-1">自分のペースで、少しずつ。</p></div><div class="text-sm font-black accent">'+n+' / '+next+'</div></div><div class="h-2 rounded-full bg-slate-100 overflow-hidden mt-4"><div class="h-full bg-accent rounded-full" style="width:'+p+'%"></div></div>'}function renderRecent(){recentActivityMember.innerHTML=activityRecords.slice(0,5).map(r=>'<div class="py-3 border-t first:border-t-0 border-slate-100"><div class="text-[10px] font-bold text-slate-400">'+jpDate(r.activity_date)+'</div><div class="text-sm font-black mt-1">'+String(r.title||'BizFit').replace(/[<>&]/g,'')+'</div></div>').join('')||'<p class="text-xs text-slate-400 py-4">まだ活動記録はありません。最初の参加からここに記録されます。</p>'}function buildJourney(){if(!activityRecords.length)return[];const asc=[...activityRecords].sort((a,b)=>a.activity_date.localeCompare(b.activity_date)),out=[{date:asc[0].activity_date,title:'BizFit START!',body:'はじめてBizFitに参加しました。'}],counts=[5,10,20,30,50,75,100];counts.forEach(n=>{if(asc.length>=n)out.push({date:asc[n-1].activity_date,title:n+'回参加',body:'参加回数が'+n+'回になりました。'})});let months=[...new Set(asc.map(ym))].sort(),run=0,last=null,done=new Set();for(const mk of months){let dt=new Date(mk+'-01T00:00:00');run=last&&diffMonth(dt,last)===1?run+1:1;last=dt;[3,6,12,24,36].forEach(n=>{if(run===n&&!done.has(n)){done.add(n);let rr=asc.filter(x=>ym(x)===mk).slice(-1)[0];out.push({date:rr.activity_date,title:n+'か月継続',body:n+'か月続けて参加しました。'})}})}return out.sort((a,b)=>b.date.localeCompare(a.date))}function renderJourney(){const list=buildJourney();journeyList.innerHTML=list.map((x,i)=>'<div class="relative pl-6 pb-5 '+(i===list.length-1?'':'border-l border-orange-200 ml-1')+'"><span class="absolute -left-[5px] top-1 w-2.5 h-2.5 rounded-full bg-accent"></span><div class="text-[9px] font-bold text-slate-400">'+x.date.replace(/-/g,'.')+'</div><div class="text-sm font-black mt-1">'+x.title+'</div><div class="text-[11px] text-slate-500 mt-1">'+x.body+'</div></div>').join('')||'<p class="text-xs text-slate-400">これからの活動がここに積み重なっていきます。</p>'}window.loadActivity=async()=>{if(typeof personId==='undefined'||!personId)return;let {data,error}=await sb.from('bizfit_activity_records').select('id,activity_date,title,activity_type,event_id').eq('person_id',personId).order('activity_date',{ascending:false});if(error){recentActivityMember.innerHTML='<p class="text-xs text-slate-400">活動記録を読み込めませんでした。</p>';return}activityRecords=data||[];renderSummary();renderCalendar();renderMilestone();renderRecent();renderJourney()};const oldShow=window.showPage;window.showPage=n=>{oldShow(n);if(n==='activity')loadActivity()};}
let tries=0,timer=setInterval(()=>{tries++;try{if(typeof personId!=='undefined'&&personId){clearInterval(timer);loadPersonal();loadActivity()}}catch(e){}if(tries>30)clearInterval(timer)},250);})();`;d.body.appendChild(s)});</script></body></html>
