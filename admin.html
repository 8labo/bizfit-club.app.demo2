</style></head><body><header><div><b>8LABO BizFit CLUB 管理</b><span>STAFF</span></div><a class="adminBack" href="https://8labo.github.io/8labo.app.demo/staff.html">← 管理一覧に戻る</a></header><div class="wrap"><div id="gate" class="status">権限を確認しています…</div><div id="app" class="hidden"><div class="tabs"><button class="on" data-tab="dashboard">ダッシュボード</button><button data-tab="events">イベント</button><button data-tab="bookings">申込・出欠</button><button data-tab="members">会員</button><button data-tab="activity">活動記録</button><button data-tab="notices">お知らせ</button></div>
<section id="dashboard" class="panel on"><div class="grid3"><div class="card kpi"><div class="label">登録会員</div><div class="num" id="kMembers">0</div><div class="note">BizFit登録者</div></div><div class="card kpi"><div class="label">今後のイベント</div><div class="num" id="kEvents">0</div><div class="note">開催予定</div></div><div class="card kpi"><div class="label">未確認のお知らせ</div><div class="num" id="kUnread">0</div><div class="note">会員延べ未確認数</div></div></div><div class="grid" style="margin-top:16px"><div class="card"><h2>次回イベント</h2><div id="nextEvent"></div></div><div class="card"><h2>最近の活動</h2><div id="recentActivity"></div></div></div></section>
<section id="events" class="panel"><div class="grid"><div class="card"><h2>イベントを登録</h2><input type="hidden" id="eId"><div class="field"><label>イベント名</label><input id="eTitle"></div><div class="row"><div class="field"><label>カテゴリ</label><select id="eCat"><option value="stretch">ストレッチ</option><option value="training">トレーニング</option><option value="community">軽スポーツ・交流</option><option value="assessment">測定</option><option value="general">その他</option></select></div><div class="field"><label>定員</label><input type="number" id="eCap" value="30"></div></div><div class="row"><div class="field"><label>日付</label><input type="date" id="eDate"></div><div class="field"><label>参加費</label><input type="number" id="ePrice" value="1000"></div></div><div class="row"><div class="field"><label>開始</label><input type="time" id="eStart"></div><div class="field"><label>終了</label><input type="time" id="eEnd"></div></div><div class="field"><label>会場</label><input id="ePlace"></div><div class="field"><label>住所</label><input id="eAddress"></div><div class="field"><label>イベント説明</label><textarea rows="4" id="eDesc"></textarea></div><div class="field"><label>持ち物</label><input id="eItems"></div><div class="field"><label>画像URL</label><input id="eImage"></div><div class="row"><div class="field"><label>同伴者申込</label><select id="eComp"><option value="true">許可する</option><option value="false">許可しない</option></select></div><div class="field"><label>公開状態</label><select id="eStatus"><option value="scheduled">公開</option><option value="draft">下書き</option><option value="cancelled">中止</option><option value="completed">終了</option></select></div></div><div class="actions"><button class="primary" id="saveEvent">保存する</button><button class="ghost hidden" id="cancelEventEdit">編集をやめる</button></div></div><div class="card"><h2>登録済みイベント</h2><div class="listSwitch"><button class="on" data-event-view="upcoming">今後の予定</button><button data-event-view="history">履歴</button><button data-event-view="cancelled">中止</button></div><div id="eventList"></div></div></div></section>
<section id="bookings" class="panel"><div class="card"><h2>申込・出欠管理</h2><div class="filters"><select id="bookingEvent"></select></div><div id="bookingList"></div></div></section>
<section id="members" class="panel"><div class="grid"><div class="card"><h2>BizFit会員を追加</h2><div class="field"><label>８LABO ID・氏名</label><input id="personSearch"></div><button class="ghost" id="searchPerson">検索</button><div id="personResults"></div></div><div class="card"><h2>会員一覧</h2><div id="memberList"></div></div></div></section>
<section id="activity" class="panel"><div class="card"><h2>活動記録</h2><div id="activityList"></div></div></section>
<section id="notices" class="panel"><div class="grid"><div class="card"><h2>お知らせを登録</h2><p class="sub">公開したお知らせは、未確認の会員のHOMEに表示されます。</p><input type="hidden" id="nId"><div class="field"><label>タイトル</label><input id="nTitle"></div><div class="field"><label>本文</label><textarea id="nBody" rows="6"></textarea></div><div class="field check"><input id="nImportant" type="checkbox"><label for="nImportant">重要なお知らせにする</label></div><div class="field"><label>公開状態</label><select id="nPublished"><option value="true">公開</option><option value="false">下書き</option></select></div><div class="actions"><button class="primary" id="saveNotice">保存する</button><button class="ghost hidden" id="cancelNoticeEdit">編集をやめる</button></div></div><div class="card"><h2>お知らせ一覧</h2><p class="sub">「確認状況」から、誰がいつ確認したかを確認できます。</p><div id="noticeList"></div></div></div></section></div></div>
<div id="readModal" class="modal hidden"><div class="modalCard"><div class="modalHead"><div><h2 id="readTitle">確認状況</h2><p id="readSummary" class="sub" style="margin:4px 0 0"></p></div><button class="close" onclick="closeReadModal()">×</button></div><div id="readList"></div></div></div>

const U='https://uksoinulgbchzvvbcezi.supabase.co',K='sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax',sb=window.supabase.createClient(U,K),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let serviceId=null,events=[],regs=[],members=[],persons=[],activities=[],notices=[],noticeReads=[],eventView='upcoming';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const nameOf=id=>{const p=persons.find(x=>x.id===id);return p?`${p.last_name} ${p.first_name}`:'—'};const labo=id=>{const p=persons.find(x=>x.id===id);return p?String(p.labo_id).padStart(4,'0'):'—'};
$$('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));function openTab(id){$$('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));$$('.panel').forEach(x=>x.classList.toggle('on',x.id===id))}$$('[data-event-view]').forEach(b=>b.onclick=()=>{eventView=b.dataset.eventView;$$('[data-event-view]').forEach(x=>x.classList.toggle('on',x===b));renderEvents()});
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('#gate').textContent='共通ポータルでログインしてから開いてください。';return}const {data:s}=await sb.from('services').select('id').eq('service_code','BIZFIT').single();if(!s){$('#gate').textContent='BizFitサービス情報を取得できません。';return}serviceId=s.id;const {data:ok}=await sb.rpc('has_service_access',{target_service_id:serviceId});if(!ok){$('#gate').textContent='BizFitクラブの管理権限がありません。';return}$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');await loadAll()}
async function loadAll(){const [ev,rg,mb,ps,ac,no,nr]=await Promise.all([sb.from('bizfit_events').select('*').order('event_date'),sb.from('bizfit_registrations').select('*').order('registered_at',{ascending:false}),sb.from('service_memberships').select('*').eq('service_id',serviceId),sb.from('persons').select('id,labo_id,last_name,first_name,email,phone,status').order('labo_id'),sb.from('bizfit_activity_records').select('*').order('activity_date',{ascending:false}),sb.from('bizfit_notices').select('*').order('created_at',{ascending:false}),sb.from('bizfit_notice_reads').select('*').order('confirmed_at',{ascending:false})]);for(const r of [ev,rg,mb,ps,ac,no,nr])if(r.error){alert(r.error.message);return}events=ev.data||[];regs=rg.data||[];members=mb.data||[];persons=ps.data||[];activities=ac.data||[];notices=no.data||[];noticeReads=nr.data||[];renderAll()}
function renderAll(){renderDashboard();renderEvents();renderBookingSelect();renderBookings();renderMembers();renderActivities();renderNotices()}
function renderDashboard(){const activeMembers=members.filter(m=>m.membership_status==='active'),today=new Date().toISOString().slice(0,10);$('#kMembers').textContent=activeMembers.length;$('#kEvents').textContent=events.filter(e=>e.event_date>=today&&e.status==='scheduled').length;const pub=notices.filter(n=>n.is_published),confirmed=new Set(noticeReads.map(r=>r.notice_id+'|'+r.person_id));$('#kUnread').textContent=pub.reduce((a,n)=>a+activeMembers.filter(m=>!confirmed.has(n.id+'|'+m.person_id)).length,0);const next=events.filter(e=>e.event_date>=today&&e.status==='scheduled').sort((a,b)=>a.event_date.localeCompare(b.event_date))[0];$('#nextEvent').innerHTML=next?`<div class="item"><div><b>${esc(next.title)}</b><span class="muted">${next.event_date} ${next.start_time?.slice(0,5)||''}<br>${esc(next.venue||'')}</span></div></div>`:'<span class="muted">今後のイベントはありません。</span>';$('#recentActivity').innerHTML=activities.slice(0,5).map(a=>`<div class="item"><div><b>${esc(a.title)}</b><span class="muted">${a.activity_date}｜${esc(nameOf(a.person_id))}</span></div></div>`).join('')||'<span class="muted">活動記録はまだありません。</span>'}
function eventItems(){const today=new Date().toISOString().slice(0,10);if(eventView==='cancelled')return events.filter(e=>e.status==='cancelled').sort((a,b)=>b.event_date.localeCompare(a.event_date));if(eventView==='history')return events.filter(e=>e.event_date<today&&e.status!=='cancelled').sort((a,b)=>b.event_date.localeCompare(a.event_date));return events.filter(e=>e.event_date>=today&&e.status!=='cancelled').sort((a,b)=>a.event_date.localeCompare(b.event_date))}function renderEvents(){const list=eventItems();$('#eventList').innerHTML=list.map(e=>`<div class="item"><div><b>${esc(e.title)} ${e.is_published?'<span class="badge live">公開</span>':'<span class="badge draft">下書き</span>'}</b><span class="muted">${e.event_date} ${e.start_time?.slice(0,5)||''}｜${esc(e.venue||'')}</span></div><div class="actions"><button class="ghost small" onclick="editEvent('${e.id}')">編集</button><button class="danger small" onclick="deleteEvent('${e.id}')">削除</button></div></div>`).join('')||`<span class="muted">${eventView==='upcoming'?'今後のイベント':eventView==='history'?'過去のイベント':'中止イベント'}はありません。</span>`}
window.editEvent=id=>{const e=events.find(x=>x.id===id);if(!e)return;$('#eId').value=e.id;$('#eTitle').value=e.title;$('#eCat').value=e.category;$('#eCap').value=e.capacity||'';$('#eDate').value=e.event_date;$('#ePrice').value=e.price;$('#eStart').value=e.start_time?.slice(0,5)||'';$('#eEnd').value=e.end_time?.slice(0,5)||'';$('#ePlace').value=e.venue||'';$('#eAddress').value=e.address||'';$('#eDesc').value=e.description||'';$('#eItems').value=e.items||'';$('#eImage').value=e.image_url||'';$('#eComp').value=String(e.companion_allowed);$('#eStatus').value=e.status;$('#cancelEventEdit').classList.remove('hidden')};function clearEvent(){['eId','eTitle','eDate','eStart','eEnd','ePlace','eAddress','eDesc','eItems','eImage'].forEach(id=>$('#'+id).value='');$('#eCap').value=30;$('#ePrice').value=1000;$('#eStatus').value='scheduled';$('#cancelEventEdit').classList.add('hidden')}$('#cancelEventEdit').onclick=clearEvent;$('#saveEvent').onclick=async()=>{if(!$('#eTitle').value||!$('#eDate').value)return alert('イベント名と日付は必須です。');const status=$('#eStatus').value,p={title:$('#eTitle').value,category:$('#eCat').value,capacity:+$('#eCap').value||null,event_date:$('#eDate').value,price:+$('#ePrice').value||0,start_time:$('#eStart').value||null,end_time:$('#eEnd').value||null,venue:$('#ePlace').value||null,address:$('#eAddress').value||null,description:$('#eDesc').value||null,items:$('#eItems').value||null,image_url:$('#eImage').value||null,companion_allowed:$('#eComp').value==='true',status,is_published:status==='scheduled'||status==='completed',updated_at:new Date().toISOString()};const id=$('#eId').value,r=id?await sb.from('bizfit_events').update(p).eq('id',id):await sb.from('bizfit_events').insert(p);if(r.error)return alert(r.error.message);clearEvent();await loadAll()};window.deleteEvent=async id=>{if(!confirm('このイベントを削除しますか？'))return;const {error}=await sb.from('bizfit_events').delete().eq('id',id);if(error)return alert(error.message);await loadAll()};
function renderBookingSelect(){const cur=$('#bookingEvent').value;$('#bookingEvent').innerHTML='<option value="">イベントを選択</option>'+events.slice().sort((a,b)=>b.event_date.localeCompare(a.event_date)).map(e=>`<option value="${e.id}">${e.event_date} ${esc(e.title)}</option>`).join('');if(events.some(e=>e.id===cur))$('#bookingEvent').value=cur}$('#bookingEvent').onchange=renderBookings;function renderBookings(){const id=$('#bookingEvent').value;if(!id){$('#bookingList').innerHTML='<span class="muted">イベントを選択してください。</span>';return}const rr=regs.filter(r=>r.event_id===id);$('#bookingList').innerHTML=rr.map(r=>`<div class="item"><div><b>${esc(nameOf(r.person_id))}</b><span class="muted">ID ${labo(r.person_id)}｜同伴 ${r.companion_count||0}名</span></div><select onchange="changeAttendance('${r.id}',this.value)"><option value="registered" ${r.status==='registered'?'selected':''}>申込</option><option value="attended" ${r.status==='attended'?'selected':''}>出席</option><option value="no_show" ${r.status==='no_show'?'selected':''}>欠席</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>キャンセル</option></select></div>`).join('')||'<span class="muted">申込者はいません。</span>'}window.changeAttendance=async(id,status)=>{const r=regs.find(x=>x.id===id),{error}=await sb.from('bizfit_registrations').update({status}).eq('id',id);if(error)return alert(error.message);if(status==='attended'&&r){const e=events.find(x=>x.id===r.event_id);if(e)await sb.from('bizfit_activity_records').upsert({person_id:r.person_id,event_id:e.id,activity_date:e.event_date,activity_type:'event',title:e.title},{onConflict:'person_id,event_id,activity_date,title'})}await loadAll()};
function renderMembers(){$('#memberList').innerHTML=members.map(m=>`<div class="item"><div><b>${esc(nameOf(m.person_id))}</b><span class="muted">ID ${labo(m.person_id)}｜${m.membership_status}</span></div><button class="ghost small" onclick="toggleMember('${m.id}','${m.membership_status==='active'?'inactive':'active'}')">${m.membership_status==='active'?'休止':'再開'}</button></div>`).join('')||'<span class="muted">BizFit会員はまだいません。</span>'}$('#searchPerson').onclick=()=>{const q=$('#personSearch').value.trim().toLowerCase();const hit=persons.filter(p=>String(p.labo_id).includes(q)||`${p.last_name}${p.first_name}`.toLowerCase().includes(q)||`${p.last_name} ${p.first_name}`.toLowerCase().includes(q)).slice(0,10);$('#personResults').innerHTML=hit.map(p=>`<div class="item"><div><b>${esc(p.last_name+' '+p.first_name)}</b><span class="muted">ID ${String(p.labo_id).padStart(4,'0')}</span></div><button class="primary small" onclick="addMember('${p.id}')">追加</button></div>`).join('')};window.addMember=async person_id=>{const {error}=await sb.from('service_memberships').upsert({person_id,service_id:serviceId,membership_status:'active',started_at:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()},{onConflict:'person_id,service_id'});if(error)return alert(error.message);await loadAll()};window.toggleMember=async(id,status)=>{const {error}=await sb.from('service_memberships').update({membership_status:status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadAll()};
function renderActivities(){$('#activityList').innerHTML=activities.map(a=>`<div class="item"><div><b>${esc(a.title)}</b><span class="muted">${a.activity_date}｜${esc(nameOf(a.person_id))}｜ID ${labo(a.person_id)}</span></div></div>`).join('')||'<span class="muted">活動記録はまだありません。</span>'}
function renderNotices(){const active=members.filter(m=>m.membership_status==='active');$('#noticeList').innerHTML=notices.map(n=>{const reads=noticeReads.filter(r=>r.notice_id===n.id),rate=active.length?Math.round(reads.length/active.length*100):0;return `<div class="item"><div><b>${esc(n.title)} ${n.is_important?'<span class="badge important">重要</span>':''}</b><span class="muted">${n.is_published?'公開':'下書き'}｜確認 ${reads.length}/${active.length}名 (${rate}%)</span></div><div class="actions"><button class="ghost small" onclick="showReadStatus('${n.id}')">確認状況</button><button class="ghost small" onclick="editNotice('${n.id}')">編集</button><button class="danger small" onclick="deleteNotice('${n.id}')">削除</button></div></div>`}).join('')||'<span class="muted">お知らせはまだありません。</span>'}
window.showReadStatus=id=>{const n=notices.find(x=>x.id===id),active=members.filter(m=>m.membership_status==='active'),reads=noticeReads.filter(r=>r.notice_id===id),map=new Map(reads.map(r=>[r.person_id,r]));$('#readTitle').textContent=n?.title||'確認状況';$('#readSummary').textContent=`確認済み ${reads.length}名 / 対象 ${active.length}名`;$('#readList').innerHTML=active.map(m=>{const r=map.get(m.person_id);return `<div class="readRow"><div><b>${esc(nameOf(m.person_id))}</b><span class="muted">ID ${labo(m.person_id)}</span></div><div>${r?`<span class="badge live">確認済み</span><div class="muted" style="margin-top:4px">${new Date(r.confirmed_at).toLocaleString('ja-JP')}</div>`:'<span class="badge draft">未確認</span>'}</div></div>`}).join('')||'<span class="muted">対象会員がいません。</span>';$('#readModal').classList.remove('hidden')};window.closeReadModal=()=>$('#readModal').classList.add('hidden');
window.editNotice=id=>{const n=notices.find(x=>x.id===id);$('#nId').value=n.id;$('#nTitle').value=n.title;$('#nBody').value=n.body;$('#nImportant').checked=n.is_important;$('#nPublished').value=String(n.is_published);$('#cancelNoticeEdit').classList.remove('hidden')};function clearNotice(){$('#nId').value=$('#nTitle').value=$('#nBody').value='';$('#nImportant').checked=false;$('#nPublished').value='true';$('#cancelNoticeEdit').classList.add('hidden')}$('#cancelNoticeEdit').onclick=clearNotice;$('#saveNotice').onclick=async()=>{if(!$('#nTitle').value||!$('#nBody').value)return alert('タイトルと本文を入力してください。');const p={title:$('#nTitle').value,body:$('#nBody').value,is_important:$('#nImportant').checked,is_published:$('#nPublished').value==='true',updated_at:new Date().toISOString()},id=$('#nId').value,r=id?await sb.from('bizfit_notices').update(p).eq('id',id):await sb.from('bizfit_notices').insert(p);if(r.error)return alert(r.error.message);clearNotice();await loadAll()};window.deleteNotice=async id=>{if(!confirm('このお知らせを削除しますか？確認履歴も削除されます。'))return;const {error}=await sb.from('bizfit_notices').delete().eq('id',id);if(error)return alert(error.message);await loadAll()};boot();
</script></body></html>
