<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFit CLUB 管理</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style></head><body><iframe id="adminFrame" src="admin-v2.html" title="BizFit CLUB 管理"></iframe><script>document.getElementById('adminFrame').addEventListener('load',()=>{const f=document.getElementById('adminFrame'),d=f.contentDocument;if(!d)return;const s=d.createElement('script');s.textContent=`(()=>{const back=document.querySelector('.back');if(back)back.setAttribute('target','_top');function syncPm(){if(typeof pmMode==='undefined')return;pmDates.classList.toggle('hidden',pmMode.value!=='period');if(pmMode.value==='until_confirmed'){pmConfirm.checked=true;pmConfirm.disabled=true}else pmConfirm.disabled=false}setTimeout(()=>{if(typeof pmMode!=='undefined'){pmMode.onchange=syncPm;syncPm()}},300);if(!document.getElementById('noticeReadModal'))document.body.insertAdjacentHTML('beforeend','<div id="noticeReadModal" style="display:none;position:fixed;inset:0;background:rgba(12,30,48,.45);z-index:999;place-items:center;padding:18px"><div style="width:min(620px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:20px"><button id="closeNoticeRead" class="ghost small">閉じる</button><h2 id="noticeReadTitle" style="margin-top:12px">確認状況</h2><p id="noticeReadSummary" class="sub"></p><div id="noticeReadList"></div></div></div>');const modal=document.getElementById('noticeReadModal');document.getElementById('closeNoticeRead').onclick=()=>modal.style.display='none';modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});window.showNoticeReadStatus=id=>{const n=notices.find(x=>x.id===id),active=members.filter(m=>m.membership_status==='active'),rr=reads.filter(r=>r.notice_id===id),map=new Map(rr.map(r=>[r.person_id,r]));noticeReadTitle.textContent=n?.title||'確認状況';noticeReadSummary.textContent='確認済み '+rr.length+'名 / 対象 '+active.length+'名';noticeReadList.innerHTML=active.map(m=>{const r=map.get(m.person_id);return '<div class="item"><div><b>'+esc(nameOf(m.person_id))+'</b><div class="muted">ID '+labo(m.person_id)+'</div></div><div>'+(r?'<span class="badge live">確認済み</span><div class="muted">'+new Date(r.confirmed_at).toLocaleString('ja-JP')+'</div>':'<span class="badge draft">未確認</span>')+'</div></div>'}).join('');modal.style.display='grid'};window.renderNotices=()=>{const active=members.filter(m=>m.membership_status==='active');noticeList.innerHTML=notices.map(n=>{const rr=reads.filter(r=>r.notice_id===n.id);return '<div class="item"><div><b>'+esc(n.title)+'</b><div class="muted">'+(n.is_published?'公開':'下書き')+'｜確認 '+rr.length+'/'+active.length+'名</div></div><div class="actions"><button class="ghost small" onclick="showNoticeReadStatus(\''+n.id+'\')">確認状況</button><button class="ghost small" onclick="editNotice(\''+n.id+'\')">編集</button><button class="danger small" onclick="delNotice(\''+n.id+'\')">削除</button></div></div>'}).join('')||'<span class="muted">お知らせなし</span>'};window.renderMessages=async()=>{pmPerson.innerHTML='<option value="">会員を選択</option>'+members.filter(m=>m.membership_status==='active').map(m=>'<option value="'+m.person_id+'">'+esc(nameOf(m.person_id))+'｜ID '+labo(m.person_id)+'</option>').join('');const q=await sb.from('bizfit_personal_message_reads').select('*'),pr=q.data||[];pmList.innerHTML=messages.map(m=>{const confirmed=pr.some(r=>r.message_id===m.id&&r.person_id===m.person_id),state=confirmed?'確認済み':(m.is_active?'表示中':'終了');return '<div class="item"><div><b>'+esc(nameOf(m.person_id))+'</b><div class="muted">'+esc(m.message)+'</div><div class="muted">'+m.display_mode+'｜'+state+'</div></div><button class="danger small" onclick="endMsg(\''+m.id+'\')">終了</button></div>'}).join('')||'<span class="muted">個別メッセージなし</span>'};const oldRenderAll=window.renderAll;window.renderAll=function(){oldRenderAll();renderNotices();renderMessages();setTimeout(syncPm,50)};setTimeout(()=>{if(typeof notices!=='undefined')renderNotices();if(typeof messages!=='undefined')renderMessages()},1000);})();`;d.body.appendChild(s)});</script></body></html>
