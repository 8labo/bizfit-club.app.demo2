b>8LABO BizFit CLUB 管理</b><a class="adminBack" href="https://8labo.github.io/8labo.app.demo/staff.html">← 管理一覧に戻る</a></header><div class="wrap"><div id="gate" class="status">権限を確認しています…</div><div id="app" class="hidden"><div class="tabs"><button class="on" data-tab="dashboard">ダッシュボード</button><button data-tab="homeSettings">ホーム設定</button><button data-tab="events">イベント</button><button data-tab="bookings">申込・出欠</button><button data-tab="members">会員</button><button data-tab="activity">活動記録</button><button data-tab="notices">お知らせ</button></div>

<section id="homeSettings" class="panel"><div class="grid"><div class="card"><h2>ホーム画面設定</h2><p class="sub">文章と文字サイズを変更できます。スライダーを動かすと右のプレビューへ即時反映されます。</p><div class="field"><label>メインメッセージ</label><textarea id="heroMessageInput" rows="3" maxlength="80"></textarea><div class="muted" style="font-size:10px"><span id="heroCount">0</span> / 80文字</div></div><div class="field"><label>メイン文字サイズ</label><div class="rangeRow"><input id="heroMessageSize" type="range" min="18" max="40" step="1"><div class="sizeBox"><span id="heroMessageSizeVal">25</span>px</div></div></div><div class="field"><label>サブメッセージ（任意）</label><textarea id="heroSubInput" rows="3" maxlength="120"></textarea></div><div class="field"><label>サブ文字サイズ</label><div class="rangeRow"><input id="heroSubSize" type="range" min="10" max="22" step="1"><div class="sizeBox"><span id="heroSubSizeVal">12</span>px</div></div></div><div class="field check"><input id="heroVisibleInput" type="checkbox"><label for="heroVisibleInput">メッセージエリアを表示する</label></div><button id="saveHomeSettings" class="primary">ホーム設定を保存</button></div><div class="card"><h2>表示プレビュー</h2><p class="sub">文章・サイズ変更は保存前でもここに反映されます。</p><div id="homePreview" class="previewHero"><div class="hello">こんにちは、○○さん</div><div id="previewMessage" class="message"></div><div id="previewSub" class="submsg"></div></div></div></div></section>

s').upsert(p,{onConflict:'id'});if(error)return alert(error.message);homeSettings=p;alert('ホーム画面設定を保存しました。')};function renderDashboard(){const active=members.filter(m=>m.membership_status==='active'),today=new Date().toISOString().slice(0,10);kMembers.textContent=active.length;kEvents.textContent=events.filter(e=>e.event_date>=today&&e.status==='scheduled').length;const c=new Set(noticeReads.map(r=>r.notice_id+'|'+r.person_id));kUnread.textContent=notices.filter(n=>n.is_published).reduce((a,n)=>a+active.filter(m=>!c.has(n.id+'|'+m.person_id)).length,0);const next=events.filter(e=>e.event_date>=today&&e.status==='scheduled')[0];nextEvent.innerHTML=next?`<div class="item"><div><b>${esc(next.title)}</b><div class="muted">${next.event_date} ${esc(next.venue||'')}</div></div></div>`:'<span class="muted">今後のイベントはありません。</span>';recentActivity.innerHTML=activities.slice(0,5).map(a=>`<div class="item"><div><b>${esc(a.title)}</b><div class="muted">${a.activity_date}｜${esc(nameOf(a.person_id))}</div></div></div>`).join('')||'<span class="muted">活動記録はまだありません。</span>'}function eventItems(){const t=new Date().toISOString().slice(0,10);if(eventView==='cancelled')return events.filter(e=>e.status==='cancelled');if(eventView==='history')return events.filter(e=>e.event_date<t&&e.status!=='cancelled');return events.filter(e=>e.event_date>=t&&e.status!=='cancelled')}function renderEvents(){eventList.innerHTML=eventItems().map(e=>`<div class="item"><div><b>${esc(e.title)}</b><div class="muted">${e.event_date}｜${esc(e.venue||'')}</div></div><div class="actions"><button class="ghost small" onclick="editEvent('${e.id}')">編集</button><button class="danger small" onclick="deleteEvent('${e.id}')">削除</button></div></div>`).join('')||'<span class="muted">該当イベントはありません。</span>'}window.editEvent=id=>{const e=events.find(x=>x.id===id);if(!e)return;[['eId',e.id],['eTitle',e.title],['eCat',e.category],['eCap',e.capacity||''],['eDate',e.event_date],['ePrice',e.price],['eStart',e.start_time?.slice(0,5)|| .join('')||'<span class="muted">活動記録はまだありません。</span>'}function renderNotices(){const active=members.filter(m=>m.membership_status==='active');noticeList.innerHTML=notices.map(n=>{const rr=noticeReads.filter(r=>r.notice_id===n.id);return `<div class="item"><div><b>${esc(n.title)}</b><div class="muted">${n.is_published?'公開':'下書き'}｜確認 ${rr.length}/${active.length}名</div></div><div class="actions"><button class="ghost small" onclick="showReadStatus('${n.id}')">確認状況</button><button class="ghost small" onclick="editNotice('${n.id}')">編集</button><button class="danger small" onclick="deleteNotice('${n.id}')">削除</button></div></div>`}).join('')||'<span class="muted">お知らせはまだありません。</span>'}window.showReadStatus=id=>{const n=notices.find(x=>x.id===id),active=members.filter(m=>m.membership_status==='active'),rr=noticeReads.filter(r=>r.notice_id===id),map=new Map(rr.map(r=>[r.person_id,r]));readTitle.textContent=n?.title||'確認状況';readSummary.textContent=`確認済み ${rr.length}名 / 対象 ${active.length}名`;readList.innerHTML=active.map(m=>{const r=map.get(m.person_id);return `<div class="readRow"><b>${esc(nameOf(m.person_id))}</b><span>${r?'確認済み':'未確認'}</span></div>`}).join('');readModal.classList.remove('hidden')};window.closeReadModal=()=>readModal.classList.add('hidden');window.editNotice=id=>{const n=notices.find(x=>x.id===id);nId.value=n.id;nTitle.value=n.title;nBody.value=n.body;nImportant.checked=n.is_important;nPublished.value=String(n.is_published);cancelNoticeEdit.classList.remove('hidden')};function clearNotice(){nId.value=nTitle.value=nBody.value='';nImportant.checked=false;nPublished.value='true';cancelNoticeEdit.classList.add('hidden')}cancelNoticeEdit.onclick=clearNotice;saveNotice.onclick=async()=>{if(!nTitle.value||!nBody.value)return alert('タイトルと本文を入力してください。');const p={title:nTitle.value,body:nBody.value,is_important:nImportant.checked,is_published:nPublished.value==='true',updated_at:new Date().toISOString()},id=nId.value,r=id?await sb.from('bizfit_notices').update(p).eq('id',id):await sb.from('bizfit_notices').insert(p);if(r.error)return alert(r.error.message);clearNotice();await loadAll()};window.deleteNotice=async id=>{if(!confirm('このお知らせを削除しますか？'))return;await sb.from('bizfit_notices').delete().eq('id',id);await loadAll()};boot();</script></body></html>
