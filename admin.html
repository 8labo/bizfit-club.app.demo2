<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFit CLUB 管理</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style></head><body><iframe id="adminFrame" src="admin-v2.html" title="BizFit CLUB 管理"></iframe><script>document.getElementById('adminFrame').addEventListener('load',()=>{const d=document.getElementById('adminFrame').contentDocument;const tabs=d.getElementById('tabs');if(!tabs)return;const order=['dashboard','events','bookings','members','activity','notices','homeSettings','personalMessages'];order.forEach(id=>{const b=tabs.querySelector('[data-tab="'+id+'"]');if(b)tabs.appendChild(b)});const admin=tabs.querySelector('[data-tab="adminSettings"]');if(admin)admin.remove();});</script></body></html>
