<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFitクラブ 管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--orange:#F39800;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 980px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:#9ca3af;letter-spacing:.14em}.back{font-size:11px;color:#6b7280;text-decoration:none}.wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:26px 0 60px}.hero{background:#20293b;color:#fff;border-radius:22px;padding:24px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.gate,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.gate{margin-top:16px;padding:14px 16px;font-size:12px;color:#4b5563}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{padding:18px;min-height:135px}.card .tag{font-size:9px;font-weight:900;color:var(--orange);letter-spacing:.1em}.card h2{font-size:17px;margin:8px 0 6px}.card p{font-size:11px;color:var(--muted);line-height:1.65;margin:0}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">BizFit CLUB<small>ADMIN PREVIEW</small></div><a class="back" href="./">← BizFitへ戻る</a></header><main class="wrap"><section class="hero"><h1>BizFitクラブ 管理</h1><p>イベント、参加者、活動記録などBizFit固有の運営機能をここに集約します。</p></section><div id="gate" class="gate">権限を確認しています…</div><section id="app" class="grid hidden"><div class="card"><div class="tag">EVENTS</div><h2>イベント管理</h2><p>開催予定・募集状況・定員・案内内容を管理します。</p></div><div class="card"><div class="tag">MEMBERS</div><h2>参加者管理</h2><p>BizFit利用者とイベント申込状況を確認します。</p></div><div class="card"><div class="tag">ACTIVITY</div><h2>活動記録</h2><p>参加履歴や継続状況を確認・管理します。</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax');const $=id=>document.getElementById(id);async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('gate').textContent='共通ポータルでログインしてから開いてください。';return}const {data:service}=await sb.from('services').select('id').eq('service_code','BIZFIT').single();if(!service){$('gate').textContent='BizFitサービス情報を取得できませんでした。';return}const {data:ok,error}=await sb.rpc('has_service_access',{target_service_id:service.id});if(error||!ok){$('gate').textContent='BizFitクラブの管理権限がありません。';return}$('gate').textContent='BizFit管理権限を確認しました。';$('app').classList.remove('hidden')}boot();</script></body></html>
