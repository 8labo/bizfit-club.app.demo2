<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BizFit CLUB</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--orange:#F39800;--ink:#172033}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans JP',sans-serif;background:#f4f6f8;color:var(--ink)}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:94px}.accent{color:var(--orange)}.bg-accent{background:var(--orange)}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #edf0f3;border-radius:22px;box-shadow:0 7px 24px rgba(20,30,50,.045)}.hero{background:linear-gradient(140deg,#181f2f,#27334b)}.hero-message{font-size:25px;line-height:1.38;letter-spacing:-.025em;font-weight:900;max-width:330px}.hero-sub{font-size:12px;line-height:1.8;color:rgba(255,255,255,.62);margin-top:8px}.section-label{font-size:10px;font-weight:900;letter-spacing:.09em;color:var(--orange)}.section-title{font-size:19px;line-height:1.4;font-weight:900;margin-top:3px}.notice-card{border:1px solid #ffe2b5;background:#fffaf2}.personal{border:1px solid #ffe2b5;background:#fffaf2;border-radius:20px;padding:17px}.personal.important{border-color:#F39800;background:#fff3df}.nav-btn.active{color:var(--orange)}.nav-btn.active .nav-icon{background:#fff4e6}.loading{min-height:100vh;display:grid;place-items:center;background:#fff;text-align:center}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:grid;place-items:end center;padding:18px}.modal.hidden{display:none}.modal-card{width:min(480px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:28px;padding:22px}.portal{width:42px;height:42px;border:1px solid #e8edf2;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#172033;line-height:1}.portal b{font-size:15px;font-weight:900}.portal span{font-size:6px;font-weight:800;margin-top:3px;letter-spacing:.01em}</style></head><body><div id="loading" class="loading"><div><b>8LABO</b><p class="text-xs text-slate-400 mt-2">共通アカウントを確認しています…</p></div></div><div id="login" class="login hidden"><button onclick="location.href='https://8labo.github.io/8labo.app.demo/'" class="px-6 py-4 rounded-2xl bg-accent text-white font-black">共通アプリでログイン</button></div><div id="member" class="app hidden"><header class="sticky top-0 z-30 bg-white/95 border-b border-slate-100"><div class="h-16 px-5 flex items-center justify-between"><button onclick="showPage('home')" class="text-left"><div class="text-[9px] font-black tracking-[.22em] text-slate-400">8LABO</div><div class="text-base font-black">BizFit <span class="accent">CLUB</span></div></button><div class="flex gap-2"><a class="portal" href="https://8labo.github.io/8labo.app.demo/" aria-label="８LABOポータルに戻る"><b>8</b><span>ポータル</span></a><button onclick="showPage('mypage')" class="w-10 h-10 rounded-full bg-slate-100 grid place-items-center"><i data-lucide="user-round" class="w-5 h-5"></i></button></div></div></header><main><section id="page-home" class="page active px-5 pt-5 space-y-5"><div id="hero" class="hero rounded-[26px] p-6 text-white"><div id="hello" class="text-[11px] text-white/60 font-bold">こんにちは</div><h1 id="heroMessage" class="hero-message mt-2">続けるほど、身体は変わる。</h1><p id="heroSub" class="hero-sub hidden"></p><div class="mt-5 bg-white/10 rounded-2xl p-4"><div class="text-[10px] text-white/55 font-bold">8月の参加目標</div><div class="text-xl font-black mt-1">0 <span class="text-xs text-white/55">/ 2回</span></div></div></div><div id="personalSection" class="hidden"><div class="section-label">MESSAGE FOR YOU</div><h2 class="section-title">あなたへのメッセージ</h2><div id="personalList" class="space-y-3 mt-3"></div></div><div id="noticeSection" class="hidden"><div class="flex items-end justify-between mb-3"><div><div class="section-label">INFORMATION</div><h2 class="section-title">お知らせ</h2></div><span id="noticeCount" class="text-[10px] font-black text-orange-600"></span></div><div id="homeNotices" class="space-y-3"></div></div><div><div class="section-label">NEXT BIZFIT</div><h2 class="section-title">次回の開催</h2><article class="card mt-3 overflow-hidden"><div class="h-36 bg-slate-200 grid place-items-center text-slate-400 text-xs font-bold">EVENT IMAGE</div><div class="p-4"><div class="font-black text-[15px]">BizFit SESSION</div><p class="text-xs leading-6 text-slate-500 mt-2">イベント情報は登録データから表示します。</p></div></article></div></section><section id="page-events" class="page px-5 pt-5"><div class="section-label">PROGRAMS</div><h1 class="text-xl font-black mt-1">参加できるイベント</h1></section><section id="page-activity" class="page px-5 pt-5"><div class="section-label">MY ACTIVITY</div><h1 class="text-xl font-black mt-1">活動記録</h1></section><section id="page-mypage" class="page px-5 pt-5 space-y-5"><div class="card p-5"><h1 id="myname" class="text-lg font-black">—</h1><p id="myid" class="text-[11px] text-slate-400 mt-1">8LABO ID —</p></div><div class="card p-5"><div class="section-label">INFORMATION HISTORY</div><h2 class="text-base font-black mt-1">確認済みのお知らせ</h2><div id="readNotices" class="mt-4"></div></div></section></main><nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 bg-white/95 border-t border-slate-100 px-3 pt-2 pb-[calc(8px+env(safe-area-inset-bottom))] flex justify-around"><button data-page="home" onclick="showPage('home')" class="nav-btn active w-1/4 text-slate-400 text-[10px] font-black"><span class="nav-icon mx-auto w-10 h-8 rounded-xl grid place-items-center"><i data-lucide="house" class="w-5 h-5"></i></span>ホーム</button><button data-page="events" onclick="showPage('events')" class="nav-btn w-1/4 text-slate-400 text-[10px] font-black"><span class="nav-icon mx-auto w-10 h-8 rounded-xl grid place-items-center"><i data-lucide="calendar-days" class="w-5 h-5"></i></span>イベント</button><button data-page="activity" onclick="showPage('activity')" class="nav-btn w-1/4 text-slate-400 text-[10px] font-black"><span class="nav-icon mx-auto w-10 h-8 rounded-xl grid place-items-center"><i data-lucide="activity" class="w-5 h-5"></i></span>記録</button><button data-page="mypage" onclick="showPage('mypage')" class="nav-btn w-1/4 text-slate-400 text-[10px] font-black"><span class="nav-icon mx-auto w-10 h-8 rounded-xl grid place-items-center"><i data-lucide="user-round" class="w-5 h-5"></i></span>マイページ</button></nav></div><div id="noticeModal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle" class="text-lg font-black"></h2><div id="modalBody" class="text-sm leading-7 mt-4"></div><button id="confirmNotice" class="mt-6 w-full py-4 rounded-2xl bg-accent text-white font-black">内容を確認しました</button></div></div><script>const sb=window.supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax');let personId,notices=[],noticeReads=[],activeNotice;const $=id=>document.getElementById(id),fmt=n=>String(n).padStart(4,'0'),today=()=>new Date().toISOString().slice(0,10);function showPage(n){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-'+n).classList.add('active');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===n));lucide.createIcons()}async function boot(){let {data:{session}}=await sb.auth.getSession();$('loading').classList.add('hidden');if(!session){$('login').classList.remove('hidden');return}let {data:a}=await sb.from('user_accounts').select('person_id').eq('auth_user_id',session.user.id).single();if(!a?.person_id){$('login').classList.remove('hidden');return}let {data:p}=await sb.from('persons').select('id,labo_id,last_name,first_name').eq('id',a.person_id).single();if(!p){$('login').classList.remove('hidden');return}personId=p.id;$('hello').textContent=`こんにちは、${p.last_name}さん`;$('myname').textContent=`${p.last_name} ${p.first_name}`;$('myid').textContent=`8LABO ID ${fmt(p.labo_id)}`;let {data:s}=await sb.from('bizfit_settings').select('*').eq('id','main').single();if(s){$('hero').classList.toggle('hidden',!s.hero_visible);$('heroMessage').textContent=s.hero_message||'続けるほど、身体は変わる。';$('heroMessage').style.fontSize=(s.hero_message_size||25)+'px';if(s.hero_submessage){$('heroSub').textContent=s.hero_submessage;$('heroSub').style.fontSize=(s.hero_submessage_size||12)+'px';$('heroSub').classList.remove('hidden')}}$('member').classList.remove('hidden');await Promise.all([loadNotices(),loadPersonal()]);lucide.createIcons()}async function loadPersonal(){let {data:m}=await sb.from('bizfit_personal_messages').select('*').eq('person_id',personId).eq('is_active',true).order('created_at',{ascending:false}),{data:r}=await sb.from('bizfit_personal_message_reads').select('*').eq('person_id',personId);let read=new Set((r||[]).map(x=>x.message_id)),t=today();let visible=(m||[]).filter(x=>{if(x.display_mode==='period'&&((x.start_date&&x.start_date>t)||(x.end_date&&x.end_date<t)))return false;if(x.display_mode==='until_confirmed'&&read.has(x.id))return false;return true});$('personalSection').classList.toggle('hidden',!visible.length);$('personalList').innerHTML=visible.map(x=>`<div class="personal ${x.is_important?'important':''}"><div class="text-[12px] leading-6 text-slate-600">${String(x.message).replace(/\n/g,'<br>')}</div>${x.require_confirmation?`<button onclick="confirmPersonal('${x.id}')" class="mt-3 px-4 py-2 rounded-xl bg-accent text-white text-[11px] font-black">確認しました</button>`:''}</div>`).join('')}window.confirmPersonal=async id=>{let {error}=await sb.from('bizfit_personal_message_reads').insert({message_id:id,person_id:personId,confirmed_at:new Date().toISOString()});if(error&&!String(error.message).includes('duplicate'))return alert(error.message);let m=(await sb.from('bizfit_personal_messages').select('display_mode').eq('id',id).single()).data;if(m?.display_mode==='until_confirmed')await sb.from('bizfit_personal_messages').update({is_active:false,updated_at:new Date().toISOString()}).eq('id',id);await loadPersonal()};async function loadNotices(){let [a,b]=await Promise.all([sb.from('bizfit_notices').select('*').eq('is_published',true).order('created_at',{ascending:false}),sb.from('bizfit_notice_reads').select('*').eq('person_id',personId)]);notices=a.data||[];noticeReads=b.data||[];let ids=new Set(noticeReads.map(x=>x.notice_id)),unread=notices.filter(x=>!ids.has(x.id));$('noticeSection').classList.toggle('hidden',!unread.length);$('noticeCount').textContent=unread.length?`未確認 ${unread.length}件`:'';$('homeNotices').innerHTML=unread.map(n=>`<button onclick="openNotice('${n.id}')" class="notice-card w-full text-left rounded-2xl p-4"><div class="text-sm font-black">${n.title}</div></button>`).join('');$('readNotices').innerHTML=noticeReads.length?noticeReads.map(r=>{let n=notices.find(x=>x.id===r.notice_id);return n?`<button onclick="openNotice('${n.id}',true)" class="w-full text-left py-3 border-t text-sm font-bold">${n.title}</button>`:''}).join(''):'<p class="text-xs text-slate-400">確認済みのお知らせはありません。</p>'}window.openNotice=(id,read=false)=>{activeNotice=notices.find(x=>x.id===id);if(!activeNotice)return;$('modalTitle').textContent=activeNotice.title;$('modalBody').textContent=activeNotice.body;$('noticeModal').classList.remove('hidden');$('confirmNotice').classList.toggle('hidden',read)};$('confirmNotice').onclick=async()=>{await sb.from('bizfit_notice_reads').insert({notice_id:activeNotice.id,person_id:personId});$('noticeModal').classList.add('hidden');await loadNotices()};boot();</script></body></html>
