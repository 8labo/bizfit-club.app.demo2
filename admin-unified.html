<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8LABO BizFit CLUB 管理</title><style>html,body{margin:0;height:100%;background:#f4f6f8}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="adminFrame" src="admin.html"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax');
const frame=document.getElementById('adminFrame');let mode='active',limit=20,editing=null,notices=[],members=[],persons=[],reads=[],serviceId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=v=>{if(!v)return'';const d=new Date(v);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
function style(doc){const st=doc.createElement('style');st.textContent=`.noticeSwitch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.noticeSwitch button{border:1px solid #e8edf2;background:#fff;color:#637083;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.noticeSwitch button.on{background:#172235;color:#fff;border-color:#172235}.moreBtn{display:block;margin:14px auto 0;border:1px solid #e8edf2;background:#fff;color:#d47d00;border-radius:12px;padding:9px 18px;font-size:11px;font-weight:900}.noticeMeta{font-size:10px;color:#748095;margin-top:4px;line-height:1.6}.noticeActions{display:flex;gap:6px;flex-wrap:wrap}.noticeStatus{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900;margin-left:5px}.nsActive{background:#e9f6ef;color:#287b56}.nsReserve{background:#eef4fb;color:#35658e}.nsDraft{background:#fff3df;color:#b56d00}.nsPast{background:#eef1f4;color:#667085}`;doc.head.appendChild(st)}
function panelHTML(){return `<div class="grid"><div class="card"><h2>お知らせを登録</h2><p class="sub">公開中・過去・下書きを同じ画面で管理します。</p><input type="hidden" id="uxId"><div class="field"><label>タイトル</label><input id="uxTitle"></div><div class="field"><label>本文</label><textarea id="uxBody" rows="6"></textarea></div><div class="field check"><input id="uxImportant" type="checkbox"><label for="uxImportant">重要なお知らせにする</label></div><div class="row"><div class="field"><label>公開状態</label><select id="uxStatus"><option value="published">公開する</option><option value="draft">下書き</option></select></div><div class="field"><label>公開日時</label><input id="uxPublish" type="datetime-local"></div></div><div class="field"><label>掲載終了日時（任意）</label><input id="uxExpire" type="datetime-local"><div class="muted" style="font-size:10px;margin-top:5px">設定すると、この日時を過ぎた後は自動で「過去のお知らせ」に移動します。</div></div><div class="actions"><button class="primary" id="uxSave">保存する</button><button class="ghost hidden" id="uxCancel">編集をやめる</button></div></div><div class="card"><h2>お知らせ一覧</h2><p class="sub">20件ずつ表示し、必要な場合だけ「もっと見る」で追加表示します。</p><div class="noticeSwitch"><button class="on" data-nmode="active">公開中</button><button data-nmode="past">過去のお知らせ</button><button data-nmode="draft">下書き</button></div><div id="uxList"></div><button id="uxMore" class="moreBtn hidden">もっと見る</button></div></div>`}
frame.addEventListener('load',async()=>{const doc=frame.contentDocument;style(doc);const panel=doc.getElementById('notices');if(!panel)return;panel.innerHTML=panelHTML();bind(doc);await load(doc)});
function bind(doc){doc.querySelectorAll('[data-nmode]').forEach(b=>b.onclick=()=>{mode=b.dataset.nmode;limit=20;doc.querySelectorAll('[data-nmode]').forEach(x=>x.classList.toggle('on',x===b));render(doc)});doc.getElementById('uxMore').onclick=()=>{limit+=20;render(doc)};doc.getElementById('uxSave').onclick=()=>save(doc);doc.getElementById('uxCancel').onclick=()=>clear(doc)}
async function load(doc){if(!serviceId){const s=await sb.from('services').select('id').eq('service_code','BIZFIT').single();if(s.error){doc.getElementById('uxList').textContent=s.error.message;return}serviceId=s.data.id}const [n,m,p,r]=await Promise.all([sb.from('bizfit_notices').select('*').order('created_at',{ascending:false}),sb.from('service_memberships').select('*').eq('service_id',serviceId),sb.from('persons').select('id,labo_id,last_name,first_name'),sb.from('bizfit_notice_reads').select('*').order('confirmed_at',{ascending:false})]);if(n.error||m.error||p.error||r.error){doc.getElementById('uxList').textContent=(n.error||m.error||p.error||r.error).message;return}notices=n.data||[];members=m.data||[];persons=p.data||[];reads=r.data||[];render(doc)}
function bucket(x){const now=Date.now();if(!x.is_published)return'draft';if(x.expires_at&&new Date(x.expires_at).getTime()<=now)return'past';return'active'}
function sorted(){return notices.filter(x=>bucket(x)===mode).sort((a,b)=>(Number(b.is_important)-Number(a.is_important))||new Date(b.publish_at||b.created_at)-new Date(a.publish_at||a.created_at))}
function render(doc){const all=sorted(),list=all.slice(0,limit),now=Date.now();doc.getElementById('uxList').innerHTML=list.map(x=>{const reserve=x.is_published&&x.publish_at&&new Date(x.publish_at).getTime()>now;const status=bucket(x)==='draft'?'<span class="noticeStatus nsDraft">下書き</span>':bucket(x)==='past'?'<span class="noticeStatus nsPast">掲載終了</span>':reserve?'<span class="noticeStatus nsReserve">公開予約</span>':'<span class="noticeStatus nsActive">公開中</span>';const rc=reads.filter(r=>r.notice_id===x.id).length,active=members.filter(m=>m.membership_status==='active').length;return `<div class="item"><div><b>${esc(x.title)} ${x.is_important?'<span class="badge important">重要</span>':''} ${status}</b><div class="noticeMeta">公開：${x.publish_at?new Date(x.publish_at).toLocaleString('ja-JP'):'即時'}${x.expires_at?'｜終了：'+new Date(x.expires_at).toLocaleString('ja-JP'):''}｜確認 ${rc}/${active}名</div></div><div class="noticeActions"><button class="ghost small" data-readid="${x.id}">確認状況</button><button class="ghost small" data-editid="${x.id}">編集</button>${bucket(x)==='past'?`<button class="ghost small" data-reopen="${x.id}">再公開</button>`:x.is_published?`<button class="ghost small" data-end="${x.id}">掲載終了</button>`:''}<button class="danger small" data-delid="${x.id}">削除</button></div></div>`}).join('')||'<span class="muted">該当するお知らせはありません。</span>';doc.getElementById('uxMore').classList.toggle('hidden',all.length<=limit);doc.querySelectorAll('[data-editid]').forEach(b=>b.onclick=()=>edit(doc,b.dataset.editid));doc.querySelectorAll('[data-delid]').forEach(b=>b.onclick=()=>del(doc,b.dataset.delid));doc.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>end(doc,b.dataset.end));doc.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>reopen(doc,b.dataset.reopen));doc.querySelectorAll('[data-readid]').forEach(b=>b.onclick=()=>readStatus(doc,b.dataset.readid))}
function edit(doc,id){const x=notices.find(n=>n.id===id);editing=id;doc.getElementById('uxId').value=id;doc.getElementById('uxTitle').value=x.title;doc.getElementById('uxBody').value=x.body;doc.getElementById('uxImportant').checked=!!x.is_important;doc.getElementById('uxStatus').value=x.is_published?'published':'draft';doc.getElementById('uxPublish').value=dt(x.publish_at);doc.getElementById('uxExpire').value=dt(x.expires_at);doc.getElementById('uxCancel').classList.remove('hidden');doc.getElementById('uxTitle').scrollIntoView({behavior:'smooth',block:'center'})}
function clear(doc){editing=null;['uxId','uxTitle','uxBody','uxPublish','uxExpire'].forEach(id=>doc.getElementById(id).value='');doc.getElementById('uxImportant').checked=false;doc.getElementById('uxStatus').value='published';doc.getElementById('uxCancel').classList.add('hidden')}
async function save(doc){const title=doc.getElementById('uxTitle').value.trim(),body=doc.getElementById('uxBody').value.trim();if(!title||!body)return alert('タイトルと本文を入力してください。');const p={title,body,is_important:doc.getElementById('uxImportant').checked,is_published:doc.getElementById('uxStatus').value==='published',publish_at:doc.getElementById('uxPublish').value?new Date(doc.getElementById('uxPublish').value).toISOString():new Date().toISOString(),expires_at:doc.getElementById('uxExpire').value?new Date(doc.getElementById('uxExpire').value).toISOString():null,updated_at:new Date().toISOString()};const r=editing?await sb.from('bizfit_notices').update(p).eq('id',editing):await sb.from('bizfit_notices').insert(p);if(r.error)return alert(r.error.message);clear(doc);await load(doc)}
async function del(doc,id){if(!confirm('このお知らせを削除しますか？確認履歴も削除されます。'))return;const r=await sb.from('bizfit_notices').delete().eq('id',id);if(r.error)return alert(r.error.message);await load(doc)}
async function end(doc,id){const r=await sb.from('bizfit_notices').update({expires_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await load(doc)}
async function reopen(doc,id){const r=await sb.from('bizfit_notices').update({is_published:true,expires_at:null,publish_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await load(doc)}
function person(id){const p=persons.find(x=>x.id===id);return p?`${esc(p.last_name)} ${esc(p.first_name)}`:'—'}
function labo(id){const p=persons.find(x=>x.id===id);return p?String(p.labo_id).padStart(4,'0'):'—'}
function readStatus(doc,id){const n=notices.find(x=>x.id===id),active=members.filter(m=>m.membership_status==='active'),rr=reads.filter(r=>r.notice_id===id),map=new Map(rr.map(r=>[r.person_id,r]));doc.getElementById('readTitle').textContent=n?.title||'確認状況';doc.getElementById('readSummary').textContent=`確認済み ${rr.length}名 / 対象 ${active.length}名`;doc.getElementById('readList').innerHTML=active.map(m=>{const r=map.get(m.person_id);return `<div class="readRow"><div><b>${person(m.person_id)}</b><span class="muted">ID ${labo(m.person_id)}</span></div><div>${r?`<span class="badge live">確認済み</span><div class="muted" style="margin-top:4px">${new Date(r.confirmed_at).toLocaleString('ja-JP')}</div>`:'<span class="badge draft">未確認</span>'}</div></div>`}).join('')||'<span class="muted">対象会員がいません。</span>';doc.getElementById('readModal').classList.remove('hidden')}
</script></body></html>
